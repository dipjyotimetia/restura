name: 📚 Documentation issue
description: Report missing, wrong, or unclear documentation
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: URL or file path of the doc (or where it should live).
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is missing or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
