name: ✨ Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol(s)
      multiple: true
      options:
        - HTTP/REST
        - GraphQL
        - gRPC
        - WebSocket
        - SSE
        - Socket.IO
        - MQTT
        - Kafka
        - MCP
        - Not protocol-specific
