# Harness / routing evals (evals/harness, evals/routing).
#
# COST: every run calls Claude for real. The harness suite runs `/ship-check --quick` per case
# per run (plus an LLM judge): the held-out test split is 10 cases, so 3 runs is 30 reviews at up
# to --max-budget-usd each (default here $10, so a hard ceiling of about $300 plus judge calls;
# typical runs cost far less). The routing suite is cheap per run (--max-turns 3, default $1 cap),
# but 30 cases x 3 runs is still 90 sessions.
#
# MODELS: `model` is pinned by default to the Sonnet the CI review jobs use (compare like with
# like: a local /ship-check inherits the developer's model). A baseline needs an explicit model,
# so leave it set. The judge defaults to Opus: a judge must not be the model under test, and judge
# calls are small (no tools, one short prompt), so the strongest grader costs little. For the
# calibration check (a stronger reviewer must score at or above a weaker one, else the cases or
# the judge are wrong) dispatch twice with the SAME judge: once as is, once with
# `model: claude-opus-5-5` (the self-judge warning fires on that run; `judge-repeat: 3` and the
# human read-back in evals/harness/baselines/README.md cover it).
#
# WHY LABEL-GATED: because of that cost (and because the result is a measurement, not a gate),
# this never runs on push or on every PR update. It runs only when someone dispatches it by
# hand, or adds the `eval-harness` label to a same-repo PR (fork PRs never get the secret).
# Remove and re-add the label to re-run. Results are uploaded as an artifact; nothing is
# committed or commented.
name: Eval harness

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which eval to run
        type: choice
        options: [harness, routing]
        default: harness
      split:
        description: Case split (train | test | all). Hillclimb on train; report on test.
        type: choice
        options: [test, train, all]
        default: test
      runs:
        description: Runs per case (1-5). The noise pre-flight refuses a baseline below what 3 runs of the test split give.
        type: string
        default: '3'
      model:
        description: Reviewer / agent model (harness and routing). Pinned so results are reproducible; a baseline refuses to run without one.
        type: string
        default: claude-sonnet-5-5
      judge-model:
        description: Harness suite only. Judge model; must not be the model under test.
        type: string
        default: claude-opus-5-5
      judge-repeat:
        description: Harness suite only. Grade each review 1 or 3 times (3 measures judge noise; a baseline uses 3 regardless)
        type: choice
        options: ['3', '1']
        default: '3'
      max-budget:
        description: Max USD per model run; blank = 10 (harness review) or 1 (routing session)
        type: string
        default: ''
      save-baseline:
        description: Harness suite only. Also write evals/harness/baselines/<stamp>--<config>.json (summary only) and upload it as the eval-baseline artifact to commit (ADR 0033 needs a committed baseline to gate against)
        type: boolean
        default: false
      sandbox:
        description: Run the reviewer's Bash in the Claude Code sandbox with network egress limited to the Claude API (strict) or unsandboxed (off)
        type: choice
        options: [strict, 'off']
        default: strict
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  eval:
    name: Eval (${{ inputs.suite || 'harness' }})
    # Bot-authored PRs (Dependabot etc.) are excluded: labeling one would run its install
    # scripts in the job that holds the Claude token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'eval-harness' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot')
    # Job-level (not workflow-level) so skipped events, such as adding any other label, never
    # cancel a running eval; a second eval of the same PR and suite queues instead of
    # cancelling paid work in progress.
    concurrency:
      group: eval-${{ github.event.pull_request.number || github.ref }}-${{ inputs.suite || 'harness' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Case bases are old main commits; the harness eval archives them into history-free repos.
          fetch-depth: 0
          # The eval hands a model Bash; never leave a git credential on disk.
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Claude Code CLI
        # Lockfile-pinned in .github/tools/claude-code (Scorecard Pinned-Dependencies);
        # bump deliberately there (eval results depend on it; every result records `claude --version`).
        run: |
          npm ci --prefix .github/tools/claude-code --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/tools/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      # The reviewer gets Bash with CLAUDE_CODE_OAUTH_TOKEN in its environment. `--disallowedTools`
      # denies curl/wget/gh/WebFetch but is not a sandbox (node -e "fetch(...)" is one line away), so
      # on this runner the Claude Code sandbox (bubblewrap + socat) wraps every Bash command:
      # network egress is denied except the hosts Claude Code itself needs (api.anthropic.com for the
      # model, platform.claude.com / claude.ai for OAuth token refresh; registry.npmjs.org because
      # `npx` in the repo's gates may resolve a bin). github.com is deliberately NOT allowed: the fix
      # to every case lives there. `strictAllowlist` is user-or-managed scope, so it goes in the
      # runner's ~/.claude/settings.json, not the repo's. `failIfUnavailable` + `allowUnsandboxedCommands:
      # false` fail closed: a review that cannot be sandboxed is a harness error, never a quiet
      # unsandboxed run. `sandbox: off` is for diagnosing a sandbox regression, not for routine runs.
      - name: Enable the Claude Code sandbox (egress allowlist)
        if: ${{ (inputs.sandbox || 'strict') == 'strict' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json <<'JSON'
          {
            "sandbox": {
              "enabled": true,
              "failIfUnavailable": true,
              "allowUnsandboxedCommands": false,
              "autoAllowBashIfSandboxed": true,
              "network": {
                "strictAllowlist": true,
                "allowedDomains": [
                  "api.anthropic.com",
                  "platform.claude.com",
                  "claude.ai",
                  "registry.npmjs.org"
                ]
              }
            }
          }
          JSON
          # Prove the allowlist holds before spending money: a non-allowlisted host must be unreachable.
          if claude -p --permission-mode dontAsk --max-turns 2 --allowedTools Bash \
               'Run exactly: node -e "fetch(\"https://example.com\").then(()=>console.log(\"REACHED\"),e=>console.log(\"BLOCKED\"))" and reply with the single word it printed.' \
             | grep -q REACHED; then
            echo "::error::sandbox egress check failed: example.com was reachable"; exit 1
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Run eval
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUITE: ${{ inputs.suite || 'harness' }}
          SPLIT: ${{ inputs.split || 'test' }}
          RUNS: ${{ inputs.runs || '3' }}
          BUDGET: ${{ inputs.max-budget || '' }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
          JUDGE_MODEL: ${{ inputs.judge-model || 'claude-opus-5-5' }}
          JUDGE_REPEAT: ${{ inputs.judge-repeat || '3' }}
          SAVE_BASELINE: ${{ inputs.save-baseline && 'true' || 'false' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RUNS" =~ ^[1-5]$ ]] || { echo "runs must be 1-5"; exit 1; }
          if [[ -z "$BUDGET" ]]; then
            if [[ "$SUITE" == routing ]]; then BUDGET=1; else BUDGET=10; fi
          fi
          [[ "$BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "max-budget must be a number"; exit 1; }
          [[ "$MODEL" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "model must be a model id"; exit 1; }
          [[ "$JUDGE_MODEL" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "judge-model must be a model id"; exit 1; }
          [[ "$JUDGE_REPEAT" =~ ^[13]$ ]] || { echo "judge-repeat must be 1 or 3"; exit 1; }
          if [[ "$MODEL" == "$JUDGE_MODEL" ]]; then
            echo "::warning::the judge model is the model under test; grades may be biased"
          fi
          git config --global user.name "eval-harness"
          git config --global user.email "eval-harness@users.noreply.github.com"
          case "$SUITE" in
            harness)
              extra=()
              [[ "$SAVE_BASELINE" == true ]] && extra+=(--save-baseline)
              npm run eval:harness -- --split "$SPLIT" --runs "$RUNS" --max-budget-usd "$BUDGET" \
                --model "$MODEL" --judge-model "$JUDGE_MODEL" --judge-repeat "$JUDGE_REPEAT" \
                --harness-ref HEAD --config "ci-${SHA::12}" "${extra[@]}"
              ;;
            routing)
              npm run eval:routing -- --split "$SPLIT" --runs "$RUNS" --max-budget-usd "$BUDGET" \
                --model "$MODEL" --ref HEAD --config "ci-${SHA::12}"
              ;;
            *) echo "unknown suite $SUITE"; exit 1 ;;
          esac

      - name: Clean up harness worktrees
        if: always() && (inputs.suite || 'harness') == 'harness'
        run: npm run eval:harness -- --cleanup

      # The baseline is summary-only (no review text), so it is safe to commit: download it and
      # open a chore PR adding it under evals/harness/baselines/.
      - name: Upload baseline
        if: ${{ always() && inputs.save-baseline && (inputs.suite || 'harness') == 'harness' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-baseline-${{ github.run_id }}
          path: evals/harness/baselines/*.json
          if-no-files-found: warn
          retention-days: 90

      # Summaries only. Transcripts are left out on purpose: a model with Read/Bash may have
      # dumped environment or file contents into them, and artifacts are readable by anyone
      # with repo read access. Re-run locally to read transcripts.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ inputs.suite || 'harness' }}-${{ github.run_id }}
          path: |
            .claude/metrics/evals/
            !.claude/metrics/evals/**/transcripts/**
          if-no-files-found: warn
          retention-days: 30
