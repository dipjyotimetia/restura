name: Security Audit

# Scheduled dependency audit. Production high/critical findings fail unless an
# owned, expiring reachability exception exists. Critical findings in build/test
# dependencies remain visible as a separate gate.

on:
  schedule:
    # Mondays 00:00 UTC — weekly, ahead of the Tuesday dependabot npm run.
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (enterprise gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Audit production dependencies (high/critical)
        run: npm run dependency:audit

      - name: Audit production + dev dependencies (critical)
        run: npm audit --audit-level=critical
