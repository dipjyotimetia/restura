name: Release signing check

# Exercises the real macOS Developer ID signing path outside of a release.
# CI's pack smoke builds unsigned (and skips Dependabot PRs), so before this
# check a signing regression first surfaced mid-release — v1.12.0 shipped npm
# + web while its macOS installers failed on an electron-builder keychain bug.
# Signs with the production cert but skips notarization (slow, Apple-side) and
# publishes nothing. afterSign (scripts/verify-electron-signature.mjs) fails
# closed on a missing or wrong Developer ID because RESTURA_REQUIRE_SIGNED_MAC
# is set.

on:
  schedule:
    # Mondays 03:00 UTC — weekly, after the Monday security audit.
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    # Packaging/signing inputs: an electron-builder bump lands via the lockfile.
    paths:
      - package-lock.json
      - electron-builder.json
      - scripts/verify-electron-signature.mjs
      - electron/resources/entitlements.mac.plist
      - .github/workflows/release-signing-check.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sign-mac:
    name: Sign macOS app (no notarize, no publish)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Require signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-npm
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build app
        run: npm run electron:build:all

      - name: Sign and verify
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RESTURA_REQUIRE_SIGNED_MAC: "true"
        run: npx electron-builder --mac --dir --publish never --config.mac.notarize=false
