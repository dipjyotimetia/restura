name: Claude Code Review

# Automated review on the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), so every
# run spends the same usage pool as interactive Claude Code. Cost controls:
#   - Reviews once when a PR is opened / marked ready / reopened — NOT on every
#     push. Re-run on demand by adding the `claude-review` label, which also
#     runs the repo's Standards/Spec skill review (label-only).
#   - Skips drafts, bots (Dependabot included), forks (no secrets there), and
#     markdown/lockfile-only changes.
#   - Skips PRs whose body carries a `/ship-check` READY marker for the exact
#     head sha (the local review fan-out already ran). Only skips a review,
#     never grants anything, and forks are excluded above.
#   - Cancels a superseded run for the same PR, caps turns and wall-clock time,
#     and uses Sonnet rather than Opus.
#   - Project hooks (.claude/settings.json) are disabled: they're for local
#     sessions and would nag a headless reviewer.
#
# Comments are posted with the Claude GitHub App token obtained via OIDC
# (`id-token: write`), so the workflow's own GITHUB_TOKEN stays read-only.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'openwiki/**'
      - '**/package-lock.json'

permissions: {}

jobs:
  claude-review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review') &&
      (github.event.action == 'labeled' || !contains(github.event.pull_request.body, format('restura:ship-check verdict=READY sha={0}', github.event.pull_request.head.sha)))
    # A local /ship-check already ran the full review fan-out for this exact
    # head sha (marker in the PR body), so skip the duplicate automatic run.
    # The claude-review label always forces one.
    # Job-level so an unrelated `labeled` event (skipped by the `if`) can't
    # cancel an in-flight review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"disableAllHooks": true}'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin stops if Claude already commented, so a label re-run must
          # say otherwise or it's a no-op.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            ${{ github.event.action == 'labeled' && 'Re-review requested via the claude-review label: do NOT stop because Claude already commented; only post issues not raised in an earlier Claude comment.' || '' }}
          # The plugin's frontmatter `allowed-tools` isn't honoured headlessly:
          # every gh command it uses must be listed or the run silently no-ops.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

  # Standards/Spec review via .claude/skills/code-review, on the label only.
  claude-skill-review:
    if: |
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: claude-skill-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD is the PR merge ref; HEAD^1 is the base tip
          persist-credentials: false

      - name: Run code-review skill
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"disableAllHooks": true}'
          prompt: |
            Use the `code-review` skill to review PR #${{ github.event.pull_request.number }}. You are running non-interactively in CI: never ask questions.
            - Fixed point: `HEAD^1` (the base tip; HEAD is the PR merge ref).
            - Spec: the PR title/body (`gh pr view ${{ github.event.pull_request.number }}`) and any issues it references (`gh issue view <n>`). If none, skip the Spec axis.
            ${{ github.event.pull_request.base.ref != github.event.repository.default_branch && format('- This is one layer of a stacked PR (base `{0}`): later layers are separate PRs, so do not report their work as missing.', github.event.pull_request.base.ref) || '' }}
            Post the aggregated report as ONE comment via `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`, starting with `# Standards & Spec review` and keeping the skill's `## Standards` / `## Spec` sections. Post nothing else.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Skill,Agent,Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
