name: Claude Code Review

# Automated review on the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), so every
# run spends the same usage pool as interactive Claude Code. Cost controls:
#   - Reviews once when a PR is opened / marked ready / reopened — NOT on every
#     push. Re-run on demand by adding the `claude-review` label.
#   - Skips drafts, bots (Dependabot included), forks (no secrets there), and
#     markdown/lockfile-only changes.
#   - Cancels a superseded run for the same PR, caps turns and wall-clock time,
#     and uses Sonnet for the orchestrating session.
#
# The code-review plugin drives the review through the `gh` CLI (pr view/diff/
# comment, issue view, search). Its frontmatter `allowed-tools` is NOT honoured
# in headless runs, so every one of those commands must be listed in
# --allowedTools below — otherwise each call is permission-denied and the run
# "succeeds" in a few turns without ever reading the diff or posting anything.
#
# Comments are posted with the Claude GitHub App token obtained via OIDC
# (`id-token: write`), so the workflow's own GITHUB_TOKEN stays read-only.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'openwiki/**'
      - '**/package-lock.json'

permissions: {}

jobs:
  claude-review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    # Job-level (not workflow-level) concurrency: a workflow-level group is
    # joined before the job `if` is evaluated, so adding ANY unrelated label
    # would cancel an in-flight review and then skip itself.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Stacked PRs (gh stack): each layer targets its parent branch, so
          # `gh pr diff` and the checked-out merge ref already scope the review
          # to that layer; the note below stops reviewers flagging work that
          # lives in another layer. Restack force-pushes (`synchronize`) are not
          # reviewed — restack before adding the label so the diff is clean.
          #
          # The plugin stops if Claude already commented on the PR, which would
          # make the `claude-review` label re-run a no-op — so a labeled run
          # explicitly asks for a fresh review.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            A separate job posts a comment headed "## Standards & Spec review"; ignore that comment when checking whether Claude already commented.
            ${{ github.event.pull_request.base.ref != github.event.repository.default_branch && format('This PR is one layer of a stacked PR (gh stack): its base is `{0}`, not `{1}`. Review ONLY this layer''s diff against `{0}`; code from lower layers is already in the base and later layers are separate PRs, so do not flag work that belongs to another layer as missing or incomplete.', github.event.pull_request.base.ref, github.event.repository.default_branch) || '' }}
            ${{ github.event.action == 'labeled' && 'Re-review explicitly requested via the claude-review label: do NOT stop because Claude already commented on this PR; review the current head and only post issues not already raised in an earlier Claude comment.' || '' }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

  # Second axis: the repo's own `.claude/skills/code-review` skill (Standards vs
  # Spec). The plugin job above hunts high-signal bugs with inline comments;
  # this one checks the diff against the repo's documented standards and the
  # originating issue, and posts ONE summary comment. Separate job (and
  # concurrency group) so either can fail or be cancelled independently.
  claude-skill-review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    concurrency:
      group: claude-skill-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The skill diffs `origin/<base>...HEAD` locally, so it needs the base
          # branch and the merge-base — a depth-1 clone has neither. For stacked
          # PRs the base is the parent layer's branch, which this also fetches.
          fetch-depth: 0
          persist-credentials: false

      - name: Run code-review skill
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the `code-review` skill (.claude/skills/code-review/SKILL.md) to review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            You are running non-interactively in CI. NEVER ask the user anything; wherever the skill says to ask, use the defaults below instead.

            - Fixed point: `origin/${{ github.event.pull_request.base.ref }}`. HEAD is the PR merge ref, so `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` is exactly this PR's change.
            - Spec source: the PR title/body (`gh pr view ${{ github.event.pull_request.number }}`) plus any issues it or its commits reference (`gh issue view <n>`; the tracker is GitHub Issues, see docs/agents/issue-tracker.md). If none exist, skip the Spec sub-agent and say "no spec available".
            - Ignore the line about `/setup-matt-pocock-skills`; the tracker is GitHub Issues.
            ${{ github.event.pull_request.base.ref != github.event.repository.default_branch && format('- This PR is one layer of a stacked PR (gh stack) based on `{0}`, not `{1}`. Review only this layer; code from lower layers is already in the base and later layers are separate PRs, so do not report work that belongs to another layer as missing (Spec) or as Shotgun Surgery/Divergent Change (Standards).', github.event.pull_request.base.ref, github.event.repository.default_branch) || '' }}

            When the skill's aggregated report is ready, post it as ONE PR comment with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`. The comment MUST start with the heading `## Standards & Spec review` and keep the skill's `### Standards` / `### Spec` sections and one-line summary. If both axes are clean, post the heading plus a single line saying so. Do not post inline comments, and do not post anything else.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Skill,Task,Agent,Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
