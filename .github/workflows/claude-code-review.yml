name: Claude Code Review

# Automated review on the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), so every
# run spends the same usage pool as interactive Claude Code. Cost controls:
#   - Reviews once when a PR is opened / marked ready / reopened — NOT on every
#     push. Re-run on demand by adding the `claude-review` label.
#   - Skips drafts, bots (Dependabot included), forks (no secrets there), and
#     markdown/lockfile-only changes.
#   - Cancels a superseded run for the same PR, caps turns and wall-clock time,
#     and uses Sonnet for the orchestrating session.
#
# The code-review plugin drives the review through the `gh` CLI (pr view/diff/
# comment, issue view, search). Its frontmatter `allowed-tools` is NOT honoured
# in headless runs, so every one of those commands must be listed in
# --allowedTools below — otherwise each call is permission-denied and the run
# "succeeds" in a few turns without ever reading the diff or posting anything.
#
# Comments are posted with the Claude GitHub App token obtained via OIDC
# (`id-token: write`), so the workflow's own GITHUB_TOKEN stays read-only.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'openwiki/**'
      - '**/package-lock.json'

permissions: {}

jobs:
  claude-review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    # Job-level (not workflow-level) concurrency: a workflow-level group is
    # joined before the job `if` is evaluated, so adding ANY unrelated label
    # would cancel an in-flight review and then skip itself.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin stops if Claude already commented on the PR, which would
          # make the `claude-review` label re-run a no-op — so a labeled run
          # explicitly asks for a fresh review.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            ${{ github.event.action == 'labeled' && 'Re-review explicitly requested via the claude-review label: do NOT stop because Claude already commented on this PR; review the current head and only post issues not already raised in an earlier Claude comment.' || '' }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
