name: Dependabot auto-merge

# Approve and enable auto-merge for Dependabot patch & minor updates (grouped
# weekly — see .github/dependabot.yml). GitHub then merges once all REQUIRED
# status checks pass (see docs/CI_CD.md). Majors, and anything that isn't a
# clean semver patch/minor, are left for manual review.
#
# Approval: the `main` ruleset requires one approving review. GITHUB_TOKEN
# (github-actions[bot]) is not allowed to approve PRs, so the approval comes
# from the restura-bot GitHub App (RELEASE_PR_APP_ID / RELEASE_PR_APP_PRIVATE_KEY
# — the same Actions secrets the release flow uses). Without them the approve
# step is skipped with a warning and the PR waits for a manual approval.
#
# Trigger: `pull_request_target`, NOT `pull_request`. With `pull_request` the
# workflow file is taken from the PR head, so a Dependabot PR bumping an action
# used here (e.g. create-github-app-token) would run that unreviewed version
# with the App key — and restura-bot is the ruleset bypass actor.
# `pull_request_target` always runs this file as it exists on `main`.
#
# Safety rules for this file (pull_request_target runs with secrets):
#   - NEVER check out or execute PR code here (no actions/checkout, no npm).
#   - The App token is minted only after the patch/minor gate and is scoped to
#     `pull-requests: write`, so it can approve but not push or bypass.
#   - fetch-metadata verifies every commit on the PR is Dependabot-authored.
#
# Prerequisites (one-time, in repo settings — see docs/CI_CD.md):
#   - Settings → General → "Allow auto-merge" enabled.
#   - Required status checks on `main`. Without them `gh pr merge --auto` errors.
#   - A red required check still blocks the merge; CI installs Dependabot PRs
#     with --ignore-scripts (ci.yml).

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    # Only ever act on Dependabot's own PRs, in runs Dependabot triggered.
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify update
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          HAS_APP: ${{ secrets.RELEASE_PR_APP_ID != '' && secrets.RELEASE_PR_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) eligible=true ;;
            *) eligible=false; echo "Update type '${UPDATE_TYPE}' needs manual review." ;;
          esac
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [ "$eligible" = true ] && [ "$HAS_APP" != true ]; then
            echo "::warning::RELEASE_PR_APP_ID / RELEASE_PR_APP_PRIVATE_KEY are not set; this PR needs a manual approval."
          fi
          echo "approve=$([ "$eligible" = true ] && [ "$HAS_APP" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Mint restura-bot token
        if: ${{ steps.gate.outputs.approve == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          # Approve-only: no contents/admin scope even though the App has it.
          permission-pull-requests: write

      - name: Approve (patch & minor only)
        if: ${{ steps.gate.outputs.approve == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved Dependabot ${UPDATE_TYPE#version-update:} update; merges only when required checks pass."

      - name: Enable auto-merge (patch & minor only)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Queue the merge. --auto waits for required checks; nothing merges red.
          gh pr merge --auto --squash "$PR_URL"
