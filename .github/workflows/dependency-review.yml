name: Dependency Review

on:
  pull_request:
    branches: [main]

# Read-only by default; the job below declares the write scopes it needs.
permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # comment-summary-in-pr posts the summary on failure.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Development dependencies run in CI and on contributors' machines,
          # so a vulnerable devDependency counts as much as a runtime one.
          fail-on-scopes: runtime, development
          comment-summary-in-pr: on-failure
          # Flag (not block) new dependencies whose OpenSSF Scorecard is low:
          # few maintainers, no branch protection, no code review — the
          # typosquat / hijack profile an advisory database can't see yet.
          # See CONTRIBUTING.md → Adding a dependency. (#1297)
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3
          # Known-bad package URLs go here as they come up, e.g.
          #   deny-packages: pkg:npm/some-typosquat
          # Allow OSI-approved licenses common in our dep tree.
          # Tighten over time once we audit transitive deps.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0,
            CC0-1.0, CC-BY-4.0, Unlicense, 0BSD, BlueOak-1.0.0, Python-2.0, MITNFA
          # Licence exceptions for CI-only tools, never bundled or shipped:
          # they run as CLIs on CI runners from the lockfile-pinned folders
          # .github/tools/publish (vsce, ovsx, chrome-webstore-upload-cli) and
          # .github/tools/cyclonedx (release SBOM generator). Most already
          # sat in the root tree via the VS Code extension's @vscode/vsce.
          # Add a package here only when it is used solely by such a tool.
          allow-dependencies-licenses: >-
            pkg:npm/nan,
            pkg:npm/normalize-package-data,
            pkg:npm/spdx-exceptions,
            pkg:npm/uri-js,
            pkg:npm/ovsx,
            pkg:npm/%40vscode/vsce-sign,
            pkg:npm/%40vscode/vsce-sign-alpine-arm64,
            pkg:npm/%40vscode/vsce-sign-alpine-x64,
            pkg:npm/%40vscode/vsce-sign-darwin-arm64,
            pkg:npm/%40vscode/vsce-sign-darwin-x64,
            pkg:npm/%40vscode/vsce-sign-linux-arm,
            pkg:npm/%40vscode/vsce-sign-linux-arm64,
            pkg:npm/%40vscode/vsce-sign-linux-x64,
            pkg:npm/%40vscode/vsce-sign-win32-arm64,
            pkg:npm/%40vscode/vsce-sign-win32-x64,
            pkg:npm/binaryextensions,
            pkg:npm/editions,
            pkg:npm/istextorbinary,
            pkg:npm/textextensions,
            pkg:npm/typed-rest-client,
            pkg:npm/version-range,
            pkg:npm/xmlbuilder
