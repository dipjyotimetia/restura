name: Release — VS Code extension

# Publishes the `extension/vscode` package (restura-vscode) to the VS Code
# Marketplace and Open VSX, and attaches the packaged `.vsix` to a GitHub
# release. The extension's version follows the desktop app: the main
# `release.yml` bumps `extension/vscode/package.json` with every app release,
# but publishing to the Marketplace is a separate, opt-in tag.
#
# Release flow:
#   1. After an app release vX.Y.Z (package.json is already X.Y.Z), tag that
#      release commit:  git tag vscode-vX.Y.Z vX.Y.Z && git push origin vscode-vX.Y.Z
#      (the tag's `1.2.3` MUST match package.json — the job fails otherwise).
#   3. This workflow builds, packages, publishes, and cuts a GitHub release.
#
# Dry runs:  Actions → "Release — VS Code extension" → Run workflow. With
#   dry_run=true (default) it builds + packages + uploads the .vsix as a build
#   artifact, but never publishes and never creates a release — safe to run
#   before the secrets below are configured.
#
# Supply-chain layout (epic #1283, #1288): `package` runs the repo's npm
# dependencies but holds no secrets and only a read token; `publish` holds the
# marketplace tokens and installs ONLY the lockfile-pinned publishers
# (.github/tools/publish) — app dependency code never runs next to a token.
# `publish` runs in the `extensions` environment (tag-only deployment rule,
# docs/CI_CD.md §7).
#
# Required `extensions` environment secrets (publish steps self-skip when absent):
#   VSCE_PAT  — Azure DevOps PAT with Marketplace "Manage" scope (vsce publish).
#   OVSX_PAT  — Open VSX access token (optional; ovsx publish self-skips if unset).

on:
  push:
    tags:
      - 'vscode-v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + package only (no publish, no release).'
        type: boolean
        default: true

# Least privilege by default; only `publish` elevates to contents: write, to
# create the GitHub release. (OpenSSF Scorecard gates token scope.)
permissions:
  contents: read

concurrency:
  # One VS Code extension release at a time; never cancel a publish mid-flight.
  group: release-vscode-extension
  cancel-in-progress: false

defaults:
  run:
    working-directory: extension/vscode

jobs:
  package:
    name: Build + package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      IS_TAG: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm
        with:
          node-version-file: '.nvmrc'
          # No dependency cache in release jobs (cache poisoning, #1291).
          cache: ''

      # Install from the repo root: the extension is an npm workspace and shares
      # the root lockfile (esbuild, @vscode/vsce, etc. resolve from the hoisted
      # root node_modules). Install scripts off; vsce-sign is the one approved
      # package vsce needs (it copies the platform signing binary into place).
      - name: Install dependencies
        working-directory: .
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund --ignore-scripts
          npm audit signatures
          npm rebuild @vscode/vsce-sign

      - name: Resolve + validate version
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ]; then
            TAG="${GITHUB_REF_NAME#vscode-v}"
            if [ "$TAG" != "$PKG_VERSION" ]; then
              echo "::error::Tag vscode-v$TAG does not match package.json version $PKG_VERSION."
              echo "Bump extension/vscode/package.json to $TAG (or retag) and retry."
              exit 1
            fi
            echo "Releasing VS Code extension v$PKG_VERSION"
          else
            echo "Dry run — packaging v$PKG_VERSION without publishing."
          fi

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      # `package` runs vscode:prepublish (esbuild --production) then vsce. The
      # produced .vsix is the exact artifact published and attached below.
      - name: Package VSIX
        id: package
        run: |
          set -euo pipefail
          npm run package
          # No leading "./" — actions/upload-artifact rejects relative "." segments
          # in the path (the produced .vsix sits in the working-directory root).
          VSIX="$(ls -1 *.vsix | head -n1)"
          echo "vsix=extension/vscode/${VSIX}" >> "$GITHUB_OUTPUT"
          echo "Packaged ${VSIX}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restura-vscode-vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [package]
    if: ${{ github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: extensions
    permissions:
      # gh release create.
      contents: write
    env:
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    steps:
      # Checkout only for the local setup action and the pinned publishers'
      # lockfile. No repo `npm ci` in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-npm
        with:
          node-version-file: '.nvmrc'
          cache: ''

      # allowScripts in .github/tools/publish/package.json approves only
      # @vscode/vsce-sign (vsce signs the package during publish).
      - name: Install pinned publishers
        working-directory: .
        run: npm ci --prefix .github/tools/publish --no-audit --no-fund

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: restura-vscode-vsix
          path: vsix

      - name: Publish to VS Code Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: ../.github/tools/publish/node_modules/.bin/vsce publish --no-dependencies --packagePath ./*.vsix
        working-directory: vsix

      - name: Publish to Open VSX
        if: env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: ../.github/tools/publish/node_modules/.bin/ovsx publish ./*.vsix --pat "$OVSX_PAT"
        working-directory: vsix

      - name: Create GitHub release
        working-directory: vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
          MARKETPLACE_PUBLISHED: ${{ env.HAS_VSCE_PAT }}
        run: |
          set -euo pipefail
          {
            echo "Restura for VS Code **v${VERSION}**."
            echo
            if [ "$MARKETPLACE_PUBLISHED" = "true" ]; then
              echo "- Published to the VS Code Marketplace."
            else
              echo "- Marketplace publish skipped (VSCE_PAT not configured) — install the attached \`.vsix\` manually."
            fi
            echo "- \`.vsix\` attached below (\`code --install-extension restura-vscode-${VERSION}.vsix\`)."
          } > notes.md
          # --latest=false: this is a separate product from the desktop app, so
          # it must not hijack the repo's "Latest release" pointer.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VS Code extension v${VERSION}" \
            --notes-file notes.md \
            --latest=false \
            ./*.vsix
