name: Setup pinned Node and npm
description: Install the repository's Node version and the npm version enforced by package.json.

inputs:
  node-version-file:
    description: File containing the Node.js version.
    required: false
    default: .nvmrc
  cache:
    description: Optional dependency cache used by actions/setup-node. Pass '' to disable ALL caching (release, signing and publish jobs must).
    required: false
    default: npm
  cache-dependency-path:
    description: Optional lockfile path(s) used to key the dependency cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.cache }}
        # setup-node auto-enables an npm cache when package.json declares
        # `packageManager: npm@…` (ours does), even with `cache: ''`. Tie the
        # auto-cache to the explicit input so '' really means no cache
        # (supply-chain epic #1283: no PR-writable cache in release jobs).
        package-manager-cache: ${{ inputs.cache != '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # Node 24.18.0 on the GitHub-hosted image bundles npm 11.16.0; install
    # the repository's pinned package manager before npm reads package.json.
    - name: Install pinned npm
      shell: bash
      run: npm install --global npm@12.1.0 --ignore-scripts

    - name: Verify toolchain
      shell: bash
      run: npm run toolchain:check
