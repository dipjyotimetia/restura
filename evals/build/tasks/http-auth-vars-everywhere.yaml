notes: |
  From #1163 (three commits squashed). The hardest task: three harnesses plus the
  secret-variable boundary. The reference added shared resolve-variables and
  secret-variable-token modules; the latter's unit test is not hidden (it pins the
  module). The requestExecutor test asserts some implementation choices (Basic with a
  secret variable deferred to main in spec.auth; refreshedAuth only on a real
  refresh); they follow from the issue's expected behaviour but are the likeliest
  source of false failures, so read failing tails before blaming the agent.
