notes: |
  From #1163 (three commits squashed). The hardest task: three harnesses plus the
  secret-variable boundary. The reference added shared resolve-variables and
  secret-variable-token modules; the latter's unit test is not hidden (it pins the
  module). Every requirement the requestExecutor test checks is stated in the issue:
  Basic with a secret variable deferred to main via spec.auth (ADR-0007), sign-at-wire
  descriptors in spec.auth, and nothing reported for persistence unless a real OAuth2
  refresh happened.
