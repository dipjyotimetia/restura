  - npx vitest run src/features/grpc shared/protocol
  - npm run type-check:all
timeoutMinutes: 75
notes: |
  From #1161 (gRPC half; see cli-graphql-get). The reference added a shared gRPC
  request-policy module with its own unit tests; those are not hidden because they
  pin the module name. The hidden test drives executeGrpc against a local HTTP
  server, so any correct implementation passes.
