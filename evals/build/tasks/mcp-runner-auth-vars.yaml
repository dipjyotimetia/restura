notes: |
  From #1151 (fix for #1131). The reference also rewrote an assertion in the
  existing mcpRunRequest test (it pinned the old folded-header shape); that file is
  deliberately NOT hidden, because it asserts an internal shape a correct
  alternative fix need not have. The agent is expected to update tests it breaks.
  The hidden file's rate-limit tests pass a retry-delay option the issue cannot
  name; an implementation with the issue's ~1s/2s delays still passes inside the
  default 5s vitest timeout.
