  reference shipped none); passToPass only checks the CLI executor suite still
  passes. The reference's new protocol.streaming case already passes on base (the
  dry run showed it), so that file is a hidden pass-to-pass guard, not fail-to-pass. CLI passToPass is
  limited to src/runner/executors: the runner-level script/Set-Cookie tests were
