id: grpc-no-deadline
title: gRPC "No deadline" aborts web streams instantly and becomes 30s in the runner
split: test
base: a9d517edffad40bc99c8ddf1aadee33a9bd7ca17
referenceCommit: f86d9671fd40df67857317631570f44e0b59905b
issue: |
  ## gRPC: "No deadline" (timeout 0) is not honoured

  The gRPC request settings have a **No deadline** option, saved as `timeout: 0`.

  **Symptoms**

  1. **Web, server-streaming**: with No deadline the stream fails immediately with
     `DEADLINE_EXCEEDED` before any message arrives. Desktop and gRPC-Web are fine.
     A missing timeout should still get the default 30s deadline, and a positive
     timeout should be passed through unchanged.
  2. **Collection runner**: a saved *streaming* request with No deadline runs with a
     30s deadline instead of none. For *unary* requests a deadline must always apply:
     `0` (or any non-positive value) means "use the default", while positive values
     are honoured.
  3. **Shared gRPC proxy core** (used by the web Worker, self-host and the CLI): a
     unary call with `timeout: 0` (also negative or `NaN`) is aborted instantly.
     It should fall back to the default deadline instead.
  4. **CLI** (`restura run`): a request saved with `timeout: 0` overrides the global
     `--timeout` with 0; it should fall back to `--timeout` like any unset value.

  **Expected**: streams treat 0 as "no deadline" end to end; unary calls always get
  a positive deadline (the request's, else the default). Same on web, desktop,
  runner and CLI.
hiddenTests:
