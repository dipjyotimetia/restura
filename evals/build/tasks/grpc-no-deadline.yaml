  - src/features/grpc/__tests__/protocol.streaming.test.ts
  - src/features/grpc/lib/__tests__/grpcSchemaSnapshot.test.ts
  - src/features/grpc/lib/__tests__/grpcStreamingClient.test.ts
failToPass:
