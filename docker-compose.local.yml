# Local self-host smoke stack. Does not require .env or a published image.
# docker compose -f docker-compose.local.yml up --build
services:
  restura-local:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only. This stack runs with DEV_BYPASS_AUTH=true and
      # ENVIRONMENT=development (localhost upstreams allowed), i.e. an
      # unauthenticated proxy — publishing it on 0.0.0.0 would hand an open
      # SSRF proxy to everyone on the LAN. Never widen this binding; for a
      # shared deployment use docker-compose.yml with WORKER_PROXY_TOKEN.
      - '127.0.0.1:${RESTURA_LOCAL_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      ENVIRONMENT: development
      DEV_BYPASS_AUTH: 'true'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 12
